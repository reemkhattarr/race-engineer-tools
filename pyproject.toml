# Root of the race-engineer-tools uv workspace.
# This file is the *coordinator*: it owns the shared dev toolchain, the shared
# lockfile (uv.lock), and the list of workspace members. It is intentionally a
# virtual (non-package) root — it ships no importable code itself.
[project]
name = "race-engineer-tools"
version = "0.0.0"
description = "A suite of focused utilities that assist a race engineer's day-to-day work."
requires-python = "==3.11.*"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# Members are added here as each tool is built.
members = ["circuit-cleaner"]

# Shared development toolchain, installed into the single workspace venv.
[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

# ---------------------------------------------------------------------------
# Tooling configuration (shared across all workspace members)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["circuit-cleaner/src", "circuit-cleaner/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["circuit_cleaner"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["circuit-cleaner/tests"]
