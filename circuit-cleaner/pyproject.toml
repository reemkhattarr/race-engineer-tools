[project]
name = "circuit-cleaner"
version = "0.2.0"
description = "Clean circuit-map images: keep the track and direction markers, drop everything else."
requires-python = "==3.11.*"
dependencies = [
    "gradio>=6.15.2",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
]

[project.scripts]
clean-circuit = "circuit_cleaner.clean_circuit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_cleaner"]
